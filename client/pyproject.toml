[project]
name = "slmcontrol-client"
version = "3.7.0"
description = "Python client for controlling SLM Control instances through HEROS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "heros>=0.13.3",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["uv_build>=0.9.17"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["slmclient", "moretzslmclient"]
